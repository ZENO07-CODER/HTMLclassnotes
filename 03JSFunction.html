<body>
    <script>
       function greeting(){
        console.log("good Noon");
       }
       greeting();
       greeting();

       function addition(a,b,c){
        return a,b,c;
       }
       console.log("The sum is"+ addition(2,3,4));

    //    Arrow function
       const subtraction = (x,y) => {console.log(x-y)};
       subtraction(5,2);

       const greet = () => {console.log("Hello")}
       greet();

    //    String methods 

    const str1 = "Javascript";
    const str2 = "CSE326";

    console.log("We are studing " + str1 + "in" + str2);

    // String template
    
    console.log(`We are studing ${str1} in ${str2}`);

    console.log(str1.indexOf("v"));
    console.log(str1.charAt(5));
    console.log(str1.length);
    console.log(str1.trim());
    console.log(str1.trim().length);
    console.log(str1.toUpperCase());
    console.log(str1.toLowerCase());
    console.log(str1.includes("v"));
    console.log(str1.slice(2,4));
    console.log(str1.replace("J", "Ta"));

    // Array method 

    let array1 = ["a","b","c","d"];
    array1.push("grapes");
    console.log(array1);
    array1.unshift("mango");
    console.log(array1);
    array1.pop(); //delete element from the last
    console.log(array1);
    array1.shift();
    console.log(array1);
    console.log(array1.slice(1,3));

    array1.splice(2,2, "tomato","potato");
    console.log(array1);

    // objects

    let student =  {
        rollno:33,
        course:"cse326",
        name:"Rishabh",
        info: function(){
            console.log("The state of student is punjab.")
        }
    }
    console.log("the roll no is " + student.rollno + "name is" + student.name);
    student.info();

    // constructor method 
    function Book(name, publisher){
        this.name = name;
        this.publisher = publisher;
    }
    const b1 = new Book("python", "pearson");
    console.log(b1.name, b1.publisher);
    const b2 = new Book("DSA", "BPB");
    console.log(b2.name,b2.publisher);

    </script>
