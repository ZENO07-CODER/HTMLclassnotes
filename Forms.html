<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <label for="U1">Username:</label>
        <input type="text" id="U1" name="Unmame" value="" 
        maxlength="11" placeholder="Enter Username" size="50">

        <br><br>

        <label for="P1">password:</label>
        <input type="password" id="P1" name="password" minlength="8"
        placeholder="Enter password">

        <br><br>

        <label for="E1">Email:</label>
        <input type="Email" id="E1" name="Email" maxlength="20" placeholder="Enter Email">

        <br><br>
        <label for="ADD1">Enter Address:</label><br>
        <textarea name="Address" id="ADD1" name="Address" maxlength="50" rows="10" cols="40"
        placeholder="Enter Address"></textarea>

        <br><br>

        <label for="ch1">Hobbies:</label><br>
        <input type="checkbox" name="hobby" id="cook1">
        <label for="cook1">Cooking</label><br>
        <input type="checkbox" name="hobby" id="sing1">
        <label for="sing1">Singing</label><br>
        <input type="checkbox" name="hobby" id="speak1">
        <label for="speak1">Public Speaking</label>

        <br><br>
        <label for="Sc1">Select Course:-</label><br>
        <input type="radio" name="Course" id="b.tech">
        <label for="b.tech">B.tech</label><br>
        <input type="radio" name="Course" id="BCA">
        <label for="BCA">BCA</label><br>
        <input type="radio" name="Course" id="B.Sc">
        <label for="B.Sc">B.sc</label>


        <br><br>

        <label for="state1">Choose state:</label><br>
        <select name="state" id="state1" size="2" multiple>
        <option value="punjab"selected>punjab</option>
        <option value="Himachal">Himachal</option>
        <option value="andhra">Andhra pradesh</option>
        <option value="rajasthan">Rajasthan</option>
        </select>



        <br><br>
        <input type="submit">
    </form>
</body>
</html>
