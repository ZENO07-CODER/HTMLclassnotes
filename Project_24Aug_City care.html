<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Department</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px;
            background-color: #f8d7da;
            color: #721c24;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .sub-text {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }
        h2 {
            font-size: 2rem;
            margin-bottom: 5px;
        }
        .small-text {
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <h1> 🏥City Care Hospital</h1>
    <!-- Top Emergency Department Title -->
    <h1>EMERGENCY DEPARTMENT</h1>
    <hr>
    
    <!-- Open 24 hours line -->
    <p> <class="sub-text"><marquee direction="right"> 🚨Emergency Department is open 24 hours a day for urgent medical assistance. </marquee></p>
    <hr

    <!-- Important Information Big Words -->
    <h2>IMPORTANT INFORMATION</h2>
    
    <!-- Priority small word line -->
    <p class="small-text"><mark>Emergency patients will be given priority.</p>

    <h4>📞 Emergency Helpline: 1800-123-4567 </h4>
    <h4> Emergency Timing 24/7</h4>
    <hr>
    <h2> 👨‍⚕️ Available Services</h2>


</body>
</html>
