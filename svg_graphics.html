#SVG = Scalable Vector Graphics.
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>SVG graphics</h2>
    
    <svg width="800" height="700"> 
        <rect height="100" width="150" fill="gold" x="500" y="20"></rect>

        <circle r="30" cx="400" cy="40" fill="red"></circle>

        <ellipse rx="50" ry="30" cx="300" cy="150" fill="blue"></ellipse>

        <line x1="50" y1="60" x2="300" y2="100" stroke="black" ></line>

    </svg>

    <svg width="600" height="500">

        <polygon points="230 250 260 270 280 220 250 110 320 220"></polygon>

        <text x="200" y="100" fill="green" font size="50">CSE326 CLASS</text>


    </svg>
    
</body>
</html>
